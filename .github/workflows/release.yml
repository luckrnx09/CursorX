name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gates:
    name: Gates (lint, typecheck, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  build:
    name: Build & Package
    needs: gates
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.x'
          cache: 'npm'

      - name: Import signing certificate (macOS)
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cursorx.p12"
          security create-keychain -p ci-build "$RUNNER_TEMP/ci.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p ci-build "$RUNNER_TEMP/ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain-db" login.keychain
          security set-keychain-settings -t 3600 "$RUNNER_TEMP/ci.keychain-db"
          security import "$RUNNER_TEMP/cursorx.p12" -k "$RUNNER_TEMP/ci.keychain-db" \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/cursorx.p12" -clcerts -nokeys \
            -passin "pass:$MAC_CERT_PASSWORD" -out "$RUNNER_TEMP/cursorx.crt"
          sudo security add-trusted-cert -d -r trustRoot -k "$RUNNER_TEMP/ci.keychain-db" "$RUNNER_TEMP/cursorx.crt"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k ci-build "$RUNNER_TEMP/ci.keychain-db"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag '$TAG' does not match package.json version '$PKG'"
            exit 1
          fi

      - name: Build & Package
        run: npm run package:all -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cursorx-macos
          path: release/*
          if-no-files-found: ignore
          retention-days: 7
